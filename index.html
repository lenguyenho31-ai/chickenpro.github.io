<!DOCTYPE html>
<html>
<head>
  <title>Chicken Clicker</title>
  <style>
    #game {
      text-align: center;
      margin-top: 50px;
    }
    #chicken {
      cursor: pointer;
      transition: transform 0.1s;
    }
    #chicken:active {
      transform: scale(1.2);
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <h2>🐔 Chicken Clicker</h2>
    <p>Điểm: <span id="score">0</span></p>
    <img src="chicken.png" id="chicken" width="150" onclick="clickChicken()">
  </div>

  <!-- Âm thanh click -->
  <audio id="chickenSound" src="chicken_1.mp3"></audio>

  <!-- Nhạc nền -->
  <audio id="bgMusic" src="steve-lava-chicken.mp3" autoplay loop></audio>

  <script>
    let score = 0;
    function clickChicken() {
      score++;
      document.getElementById("score").textContent = score;
      const sound = document.getElementById("chickenSound");
      sound.currentTime = 0; // reset để phát lại từ đầu
      sound.play();
    }

    // Tùy chỉnh nhạc nền (tăng-giảm âm lượng)
    const bg = document.getElementById("bgMusic");
    bg.volume = 0.3; // âm lượng 30%
  </script>

  <header>
    <h1>🐔 Chào Mừng Đến Với Chicken Gang</h1>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="about.html">Giới thiệu</a>
    </nav>
  </header>

  <main>
    <p>Website được host miễn phí bằng GitHub Pages.</p>

    <!-- Nút bấm -->
    <button onclick="sayWelcome()">Bấm thử</button>

    <script>
      function sayWelcome() {
        alert("Welcome to Chicken Gang!");
        const sound = document.getElementById("chickenSound");
        sound.play();
      }   
    </script>

    <!-- Khung chat Discord -->
    <iframe src="https://discord.com/widget?id=1533513989777002577&theme=dark"
      width="100%" height="600"
      allowtransparency="true"
      frameborder="0"
      sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
    </iframe>
  </main>

  <footer>
    <p>&copy; 2026 Chicken Gang</p>
  </footer>
</body>
</html>
