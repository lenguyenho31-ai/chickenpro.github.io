<!DOCTYPE html>
<html>
<head>
  <title>Egg Balance Game</title>
  <style>
    body {
      margin: 0;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 2px solid #000;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }
    button {
      font-size: 20px;
      margin: 0 10px;
      padding: 10px 20px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="controls">
    <button onclick="pushEgg('left')">⬅️ Trái</button>
    <button onclick="pushEgg('right')">Phải ➡️</button>
  </div>

  <!-- Matter.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script>
    const { Engine, Render, Runner, Bodies, World, Body } = Matter;

    const engine = Engine.create();
    const world = engine.world;

    const render = Render.create({
      canvas: document.getElementById("gameCanvas"),
      engine: engine,
      options: { width: 600, height: 400, wireframes: false, background: "#fff" }
    });

    Render.run(render);
    Runner.run(Runner.create(), engine);

    // Nền đất
    const ground = Bodies.rectangle(300, 390, 600, 20, { isStatic: true });

    // Hai tổ chim to hơn trứng 🪺
    const leftNest = Bodies.rectangle(150, 350, 150, 40, { isStatic: true });
    const rightNest = Bodies.rectangle(450, 350, 150, 40, { isStatic: true });

    // Trứng nhỏ 🥚
    const egg = Bodies.circle(300, 100, 20, { restitution: 0.3, friction: 0.05 });

    World.add(world, [ground, leftNest, rightNest, egg]);

    // Điều khiển bằng phím
    window.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") {
        pushEgg("left");
      } else if (e.key === "ArrowRight") {
        pushEgg("right");
      }
    });

    // Hàm tác động lực
    function pushEgg(side) {
      if (side === "left") {
        Body.applyForce(egg, egg.position, { x: -0.05, y: 0 });
      } else {
        Body.applyForce(egg, egg.position, { x: 0.05, y: 0 });
      }
    }
  </script>
</body>
</html>
