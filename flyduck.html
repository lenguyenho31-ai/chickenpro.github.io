<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Duck Shooter</title>
  <style>
    body { margin:0; overflow:hidden; background:#87CEEB; }
    #duck {
      position:absolute;
      font-size:50px;
      cursor: crosshair;
    }
    #score {
      position:fixed;
      top:10px; left:10px;
      font-size:20px; color:#fff;
    }
  </style>
</head>
<body>
  <div id="score">Điểm: 0</div>
  <div id="duck">🦆</div>

  <script>
    const duck = document.getElementById('duck');
    const scoreEl = document.getElementById('score');
    let score = 0;
    let x = 0, dx = 4;
    let y = 200; // độ cao ban đầu

    function moveDuck() {
      x += dx;
      if (x > window.innerWidth-50 || x < 0) dx *= -1;
      duck.style.left = x + 'px';
      duck.style.top = y + 'px';
      requestAnimationFrame(moveDuck);
    }
    moveDuck();

    duck.addEventListener('click', () => {
      score++;
      scoreEl.textContent = `Điểm: ${score}`;
      // đổi độ cao ngẫu nhiên sau khi bắn
      y = Math.random() * (window.innerHeight-100);
      x = 0; // reset vị trí ngang
    });
  </script>
</body>
</html>
