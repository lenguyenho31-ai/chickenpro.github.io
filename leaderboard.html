<<!DOCTYPE html>
<html>
<head>
  <script>
  // Hàm lưu điểm vào localStorage
  function saveGame(playerName, score) {
    let scores = JSON.parse(localStorage.getItem("scores")) || [];
    scores.push({ name: playerName, score: score });
    localStorage.setItem("scores", JSON.stringify(scores));
    alert("Game đã được lưu cho " + playerName + " với điểm: " + score);
  }

  // Ví dụ: gọi hàm khi người chơi kết thúc
  // Bạn có thể thay playerName bằng input từ người chơi
  // và score là biến điểm trong game
  // saveGame("Pery", 25);
</script>
  <title>🏆 Leaderboard Top 10</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      text-align: center;
    }
    h1 {
      color: #d32f2f;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 70%;
      background: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
    }
    th {
      background: #ffeb3b;
    }
  </style>
</head>
<body>
  <h1>🏆 Bảng Xếp Hạng Top 10</h1>
  <table id="leaderboard">
    <tr>
      <th>Thứ hạng</th>
      <th>Tên</th>
      <th>Điểm</th>
    </tr>
  </table>

  <script>
    // Lấy dữ liệu từ localStorage
    let scores = JSON.parse(localStorage.getItem("scores")) || [];

    // Sắp xếp giảm dần theo điểm
    scores.sort((a, b) => b.score - a.score);

    // Chỉ lấy top 10
    scores = scores.slice(0, 10);

    // Hiển thị lên bảng
    const table = document.getElementById("leaderboard");
    scores.forEach((entry, index) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${index + 1}</td>
        <td>${entry.name}</td>
        <td>${entry.score}</td>
      `;
      table.appendChild(row);
    });
  </script>
</body>
</html>
