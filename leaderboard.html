<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🏆 Leaderboard Top 10</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      text-align: center;
    }
    h1 {
      color: #d32f2f;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 70%;
      background: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
    }
    th {
      background: #ffeb3b;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #d32f2f;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: transform 0.3s, background-color 0.3s;
    }
    button:hover {
      transform: scale(1.1);
      background-color: #b71c1c;
    }
  </style>
</head>
<body>
  <h1>🏆 Bảng Xếp Hạng Top 10</h1>
  <table id="leaderboard">
    <tr>
      <th>Thứ hạng</th>
      <th>Tên</th>
      <th>Điểm</th>
    </tr>
  </table>

  <!-- Nút reset -->
  <button onclick="resetLeaderboard()">🗑️ Reset Leaderboard</button>

  <script>
    // Lấy dữ liệu từ localStorage
    let scores = JSON.parse(localStorage.getItem("scores")) || [];

    // Sắp xếp giảm dần theo điểm
    scores.sort((a, b) => b.score - a.score);

    // Chỉ lấy top 10
    scores = scores.slice(0, 10);

    // Hiển thị lên bảng
    const table = document.getElementById("leaderboard");
    scores.forEach((entry, index) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${index + 1}</td>
        <td>${entry.name}</td>
        <td>${entry.score}</td>
      `;
      table.appendChild(row);
    });

    // Hàm reset leaderboard với mật khẩu
    function resetLeaderboard() {
      const password = prompt("Nhập mật khẩu để reset leaderboard:");
      const correctPassword = "chicken123"; // 🔑 thay bằng mật khẩu thật của bạn

      if (password === correctPassword) {
        localStorage.removeItem("scores");
        alert("Bảng xếp hạng đã được reset!");
        location.reload();
      } else {
        alert("Sai mật khẩu! Không thể reset leaderboard.");
      }
    }
  </script>
</body>
</html>
