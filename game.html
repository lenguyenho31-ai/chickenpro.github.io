<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chicken Gang - Game Bắn Vịt</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      text-align: center;
      background: #FFFFFF; /* nền trắng */
      overflow: hidden;
    }
    h1 {
      margin: 10px;
      color: #ff6f61;
      font-family: 'Fredoka One', cursive;
      animation: bounce 2s infinite;
    }
    #scoreboard {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.7);
      padding: 5px 10px;
      border-radius: 6px;
    }
    canvas {
      display: block;
      background: #FFFFFF; /* canvas trắng */
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #ff6f61;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: transform 0.3s, background-color 0.3s;
      margin: 10px;
    }
    button:hover {
      transform: scale(1.1);
      background-color: #e85c50;
    }
  </style>
</head>
<body>
  <h1>🐔 Chicken Gang - Game Bắn Vịt 🦆</h1>
  <div id="scoreboard">Điểm: 0</div>
  <canvas id="gameCanvas"></canvas>

  <div id="controls">
    <button onclick="saveGame()">💾 Lưu điểm</button>
    <button onclick="window.open('leaderboard.html','_blank')">🏆 Xem Bảng Xếp Hạng</button>
    <button onclick="window.open('index.html','_blank')">⬅️ Quay lại Trang Chủ</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const duckImg = new Image();
    duckImg.src = "duck.png"; // ảnh vịt nền trong suốt

    let duck = null;
    let score = 0;

    function createDuck() {
      const x = Math.random() * (canvas.width - 120);
      const y = Math.random() * (canvas.height - 120);
      duck = { x, y, createdAt: Date.now(), hit: false };
    }

    function drawDuck(d) {
      if (d.hit) {
        // animation khi bị bắn: rung nhẹ
        const offset = Math.sin(Date.now() / 50) * 10;
        ctx.save();
        ctx.translate(d.x + offset, d.y);
        ctx.drawImage(duckImg, 0, 0, 120, 120);
        ctx.restore();
      } else {
        ctx.drawImage(duckImg, d.x, d.y, 120, 120);
      }
    }

    function drawScore() {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(5, 5, 120, 30);
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("Điểm: " + score, 15, 27);
    }

    function update() {
      ctx.fillStyle = "#FFFFFF"; // nền trắng
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!duck) createDuck();

      if (duck) {
        if (Date.now() - duck.createdAt > 4000 && !duck.hit) {
          duck = null;
        } else {
          drawDuck(duck);
        }
      }

      drawScore();
      requestAnimationFrame(update);
    }

    canvas.addEventListener("mousedown", (e) => {
      if (e.button === 0 && duck) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (
          mouseX > duck.x &&
          mouseX < duck.x + 120 &&
          mouseY > duck.y &&
          mouseY < duck.y + 120
        ) {
          duck.hit = true;
          score++;
          document.getElementById("scoreboard").textContent = "Điểm: " + score;
          setTimeout(() => {
            duck = null;
            createDuck();
          }, 400); // animation rung 0.4s
        }
      }
    });

    update();

    function saveGame() {
      let playerName = prompt("Nhập tên của bạn:");
      if (!playerName) playerName = "Người chơi";
      let scores = JSON.parse(localStorage.getItem("scores")) || [];
      scores.push({ name: playerName, score: score });
      localStorage.setItem("scores", JSON.stringify(scores));
      alert("Đã lưu điểm cho " + playerName + " với điểm: " + score);
    }

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
