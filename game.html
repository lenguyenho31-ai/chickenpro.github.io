<!DOCTYPE html>
<html>
<head>
  <title>Duck Clicker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fff; /* nền đen */
      color: #000;      /* chữ trắng */
    }
    #game {
      position: relative;
      width: 150%;
      height: 100%;
      border: 2px solid #ccc;
      overflow: hidden;
      text-align: center;
      background: #fff;
    }
    #scoreBox {
      margin: 10px;
      font-size: 20px;
    }
    #duck, #fakeDuck {
      position: absolute;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
      font-size: 100px;
    }
    #duck.clicked {
      transform: scale(1.3) rotate(10deg);
      filter: brightness(1.3);
    }
    #fakeDuck {
      opacity: 0.4;
      color: gray;
      display: none;
    }
    #winMessage {
      display:none;
      position:fixed;
      top:30%;
      left:50%;
      transform:translate(-50%,-50%);
      background:#fff;
      padding:20px;
      border:3px solid #000;
      text-align:center;
      z-index:999;
    }
    #winMessage h1 {
      color:red;
      font-size:40px;
      margin-bottom:15px;
    }
    #winMessage img {
      max-width:400px;
    }
    #countdown {
      font-size: 24px;
      color: blue;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="scoreBox">
      Điểm: <span id="score">0</span> | Màn: <span id="level">1</span>
    </div>
    <span id="duck">🦆</span>
    <span id="fakeDuck">🦆</span>
  </div>

  <div id="winMessage">
    <h1>🎉 YOU WON! 🎉</h1>
    <img src="data:image/webp;base64,UklGRsZVAQBXRUJQVlA4WAoAAAAgAAAA3wIA3wIASUNDUEgMAA...CHUOI_BASE64_DAI..." alt="You Won Image">
    <p id="countdown"></p>
  </div>

  <script>
    let score = 0;
    let level = 1;
    const maxLevel = 10;
    let difficulty = "easy";
    let isPaused = false;

    const duck = document.getElementById("duck");
    const fakeDuck = document.getElementById("fakeDuck");
    const gameArea = document.getElementById("game");

    function randomPosition() {
      if (isPaused) return;
      const maxX = gameArea.clientWidth - 150;
      const maxY = gameArea.clientHeight - 150;
      const x = Math.floor(Math.random() * maxX);
      const y = Math.floor(Math.random() * maxY);
      duck.style.left = x + "px";
      duck.style.top = y + "px";
    }

    function randomFakePosition() {
      if (isPaused) return;
      const maxX = gameArea.clientWidth - 120;
      const maxY = gameArea.clientHeight - 120;
      const x = Math.floor(Math.random() * maxX);
      const y = Math.floor(Math.random() * maxY);
      fakeDuck.style.left = x + "px";
      fakeDuck.style.top = y + "px";
    }

    setInterval(() => {
      if (!isPaused) {
        randomPosition();
        if (difficulty === "super") randomFakePosition();
      }
    }, 1000);

    function showWinMessage() {
      const msg = document.getElementById("winMessage");
      msg.style.display = "block";
    }

    function applyDifficulty() {
      duck.style.fontSize = "150px";
      if (difficulty === "easy") {
        duck.style.color = "black";
        fakeDuck.style.display = "none";
      } else if (difficulty === "hard") {
        duck.style.color = "black";
        fakeDuck.style.display = "none";
      } else if (difficulty === "super") {
        duck.style.color = "red";
        fakeDuck.style.display = "block";
      }
    }

    function nextLevel() {
      level++;
      document.getElementById("level").textContent = level;
      if (level <= 4) difficulty = "easy";
      else if (level <= 7) difficulty = "hard";
      else difficulty = "super";
      applyDifficulty();
    }

    function clickDuck() {
      if (isPaused) return;
      score++;
      document.getElementById("score").textContent = score;

      duck.classList.add("clicked");
      setTimeout(() => duck.classList.remove("clicked"), 300);

      let goal = 10 * Math.pow(2, level - 1);
      if (score >= goal) {
        showWinMessage();
        isPaused = true;

        let timeLeft = 10;
        const countdownEl = document.getElementById("countdown");
        countdownEl.textContent = `⏳ Tiếp tục sau ${timeLeft} giây...`;

        const timer = setInterval(() => {
          timeLeft--;
          countdownEl.textContent = `⏳ Tiếp tục sau ${timeLeft} giây...`;
          if (timeLeft <= 0) {
            clearInterval(timer);
            countdownEl.textContent = "";
            isPaused = false;
            document.getElementById("winMessage").style.display = "none";

            if (level < maxLevel) {
              nextLevel();
            } else {
              alert("🏆 Chúc mừng! Bạn đã hoàn thành tất cả 10 màn!");
              score = 0;
              level = 1;
              document.getElementById("score").textContent = score;
              document.getElementById("level").textContent = level;
              difficulty = "easy";
              applyDifficulty();
            }
          }
        }, 1000);
      }

      let highScore = localStorage.getItem("highScore") || 0;
      if (score > highScore) {
        localStorage.setItem("highScore", score);
        localStorage.setItem("leaderName", "Pery");
      }
    }

    fakeDuck.onclick = function() {
      if (isPaused) return;
      if (difficulty === "super") {
        score -= 2;
        if (score < 0) score = 0;
        document.getElementById("score").textContent = score;
      }
    };

    // Vô hiệu hóa chuột phải trong khu vực game
    gameArea.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });

    // Chỉ cho phép click chuột trái khi chơi
    duck.addEventListener("mousedown", function(e) {
      if (e.button === 0) {
        clickDuck();
      } else {
        e.preventDefault();
      }
    });
  </script>

  <p style="text-align:center; margin-top:20px;">
    <a href="index.html">⬅️ Quay lại Trang chủ</a> |
    <a href="leaderboard.html">🏆 Xem Bảng Xếp Hạng</a>
  </p>
</body>
</html>
