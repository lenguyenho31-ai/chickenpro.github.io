<!DOCTYPE html>
<html>
<head>
  <title>Chicken Clicker</title>
  <style>
    #game {
      position: relative;
      width: 100%;
      height: 600px;
      border: 2px solid #ccc;
      overflow: hidden;
      text-align: center;
    }
    #scoreBox {
      margin: 10px;
      font-size: 20px;
    }
    #chicken {
      position: absolute;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
      width: 150px;
    }
    #chicken.clicked {
      transform: scale(1.3) rotate(10deg);
      filter: brightness(1.3);
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="scoreBox">Điểm: <span id="score">0</span></div>
    <img src="chicken.png" id="chicken" onclick="clickChicken()">
  </div>

  <!-- Âm thanh click -->
  <audio id="chickenSound" src="chicken_1.mp3"></audio>

  <!-- Nhạc nền -->
  <audio id="bgMusic" src="steves-lava-chicken.mp3" loop></audio>

  <script>
    let score = 0;
    const chickenImg = document.getElementById("chicken");
    const gameArea = document.getElementById("game");

    function randomPosition() {
      const maxX = gameArea.clientWidth - chickenImg.clientWidth;
      const maxY = gameArea.clientHeight - chickenImg.clientHeight;
      const x = Math.floor(Math.random() * maxX);
      const y = Math.floor(Math.random() * maxY);
      chickenImg.style.left = x + "px";
      chickenImg.style.top = y + "px";
    }
    randomPosition();

    function clickChicken() {
      score++;
      document.getElementById("score").textContent = score;

      // hiệu ứng
      chickenImg.classList.add("clicked");
      setTimeout(() => chickenImg.classList.remove("clicked"), 300);

      // âm thanh
      const sound = document.getElementById("chickenSound");
      sound.currentTime = 0;
      sound.play();

      // gà nhảy vị trí mới
      randomPosition();

      // cập nhật điểm cao nhất
      let highScore = localStorage.getItem("highScore") || 0;
      if (score > highScore) {
        localStorage.setItem("highScore", score);
        localStorage.setItem("leaderName", "Pery"); // tạm đặt tên người chơi
      }
    }

    // phát nhạc nền khi người chơi click lần đầu
    window.addEventListener("click", function() {
      const bg = document.getElementById("bgMusic");
      if (bg.paused) {
        bg.volume = 0.3;
        bg.play();
      }
    });
  </script>

  <p style="text-align:center; margin-top:20px;">
    <a href="index.html">⬅️ Quay lại Trang chủ</a> |
    <a href="leaderboard.html">🏆 Xem Bảng Xếp Hạng</a>
  </p>
</body>
</html>
