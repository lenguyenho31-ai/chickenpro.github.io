<!DOCTYPE html>
<html>
<head>
  <title>Duck Clicker</title>
  <style>
    #game {
      position: relative;
      width: 100%;
      height: 600px;
      border: 2px solid #ccc;
      overflow: hidden;
      text-align: center;
    }
    #scoreBox {
      margin: 10px;
      font-size: 20px;
    }
    #duck {
      position: absolute;
      cursor: pointer;
      font-size: 250px; /* chỉnh kích thước con vịt */
      transition: transform 0.2s, filter 0.2s;
    }
    #duck.clicked {
      transform: scale(1.3) rotate(10deg);
      filter: brightness(1.3);
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="scoreBox">Điểm: <span id="score">0</span></div>
    <span id="duck" onclick="clickDuck()">🦆</span>
  </div>

  <!-- Âm thanh click -->
  <audio id="duckSound" src="chicken_1.mp3"></audio>

  <!-- Nhạc nền -->
  <audio id="bgMusic" src="steves-lava-chicken.mp3" loop></audio>

  <script>
    let score = 0;
    const duck = document.getElementById("duck");
    const gameArea = document.getElementById("game");

    function randomPosition() {
      const maxX = gameArea.clientWidth - 120; // emoji width approx
      const maxY = gameArea.clientHeight - 120;
      const x = Math.floor(Math.random() * maxX);
      const y = Math.floor(Math.random() * maxY);
      duck.style.left = x + "px";
      duck.style.top = y + "px";
    }
    randomPosition();

    function clickDuck() {
      score++;
      document.getElementById("score").textContent = score;

      // hiệu ứng khi click
      duck.classList.add("clicked");
      setTimeout(() => duck.classList.remove("clicked"), 300);

      // phát âm thanh click
      const sound = document.getElementById("duckSound");
      sound.currentTime = 0;
      sound.play();

      // vịt nhảy sang vị trí mới
      randomPosition();

      // lưu điểm cao nhất
      let highScore = localStorage.getItem("highScore") || 0;
      if (score > highScore) {
        localStorage.setItem("highScore", score);
        localStorage.setItem("leaderName", "Pery");
      }
    }

    // phát nhạc nền khi người chơi click lần đầu
    window.addEventListener("click", function() {
      const bg = document.getElementById("bgMusic");
      if (bg.paused) {
        bg.volume = 0.3;
        bg.play();
      }
    });
  </script>

  <p style="text-align:center; margin-top:20px;">
    <a href="index.html">⬅️ Quay lại Trang chủ</a> |
    <a href="leaderboard.html">🏆 Xem Bảng Xếp Hạng</a>
  </p>
</body>
</html>
