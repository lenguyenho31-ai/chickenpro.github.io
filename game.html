<!DOCTYPE html>
<html>
<head>
  <title>Duck Clicker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }
    #game {
      position: relative;
      width: 100%;
      height: 100%;
      border: 2px solid #ccc;
      overflow: hidden;
      text-align: center;
    }
    #scoreBox {
      margin: 10px;
      font-size: 20px;
    }
    #duck, #fakeDuck {
      position: absolute;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
      /* bỏ font-size mặc định để JS điều khiển */
    }
    #duck.clicked {
      transform: scale(1.3) rotate(10deg);
      filter: brightness(1.3);
    }
    #fakeDuck {
      opacity: 0.4;
      color: gray;
      display: none; /* chỉ hiện ở chế độ siêu nhân */
    }
    #winMessage {
      display:none;
      position:fixed;
      top:30%;
      left:50%;
      transform:translate(-50%,-50%);
      background:#fff;
      padding:20px;
      border:3px solid #000;
      text-align:center;
      z-index:999;
    }
    #winMessage h1 {
      color:red;
      font-size:40px;
      margin-bottom:15px;
    }
    #winMessage img {
      max-width:400px;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="scoreBox">
      Điểm: <span id="score">0</span> | Màn: <span id="level">1</span>
    </div>
    <span id="duck" onclick="clickDuck()">🦆</span>
    <span id="fakeDuck">🦆</span>
  </div>

  <!-- Âm thanh click -->
  <audio id="duckSound" src="chicken_1.mp3"></audio>
  <!-- Nhạc nền -->
  <audio id="bgMusic" src="steves-lava-chicken.mp3" loop></audio>

  <!-- Popup YOU WON -->
  <div id="winMessage">
    <h1>🎉 YOU WON! 🎉</h1>
    <!-- Ảnh IMG_4914.webp đã nhúng Base64 -->
    <img src="data:image/webp;base64,UklGRsZVAQBXRUJQVlA4WAoAAAAgAAAA3wIA3wIASUNDUEgMAA...CHUOI_BASE64_DAI..." alt="You Won Image">
  </div>

  <script>
    let score = 0;
    let level = 1;
    const maxLevel = 10;
    let difficulty = "easy";
    let isPaused = false;

    const duck = document.getElementById("duck");
    const fakeDuck = document.getElementById("fakeDuck");
    const gameArea = document.getElementById("game");

    function getDuckLifetime() {
      if (difficulty === "easy") return 2000;   // 2 giây
      if (difficulty === "hard") return 1000;   // 1 giây
      if (difficulty === "super") return 500;   // 0.5 giây
    }

    function randomPosition() {
      if (isPaused) return;
      const maxX = gameArea.clientWidth - 150;
      const maxY = gameArea.clientHeight - 150;
      const x = Math.floor(Math.random() * maxX);
      const y = Math.floor(Math.random() * maxY);
      duck.style.left = x + "px";
      duck.style.top = y + "px";

      setTimeout(() => {
        if (!isPaused) {
          const newX = Math.floor(Math.random() * maxX);
          const newY = Math.floor(Math.random() * maxY);
          duck.style.left = newX + "px";
          duck.style.top = newY + "px";
        }
      }, getDuckLifetime());
    }
    randomPosition();

    function randomFakePosition() {
      if (isPaused) return;
      const maxX = gameArea.clientWidth - 120;
      const maxY = gameArea.clientHeight - 120;
      const x = Math.floor(Math.random() * maxX);
      const y = Math.floor(Math.random() * maxY);
      fakeDuck.style.left = x + "px";
      fakeDuck.style.top = y + "px";

      setTimeout(() => {
        if (!isPaused) {
          const newX = Math.floor(Math.random() * maxX);
          const newY = Math.floor(Math.random() * maxY);
          fakeDuck.style.left = newX + "px";
          fakeDuck.style.top = newY + "px";
        }
      }, 500);
    }

    function showWinMessage() {
      const msg = document.getElementById("winMessage");
      msg.style.display = "block";
      setTimeout(() => {
        msg.style.display = "none";
      }, 3000);
    }

    function applyDifficulty() {
      if (difficulty === "easy") {
        duck.style.fontSize = "150px";
        duck.style.color = "black";
        fakeDuck.style.display = "none";
      } else if (difficulty === "hard") {
        duck.style.fontSize = "100px";
        duck.style.color = "black";
        fakeDuck.style.display = "none";
      } else if (difficulty === "super") {
        duck.style.fontSize = "80px";
        duck.style.color = "red";
        fakeDuck.style.display = "block";
        randomFakePosition();
      }
    }

    function nextLevel() {
      level++;
      document.getElementById("level").textContent = level;

      if (level <= 4) {
        difficulty = "easy";
      } else if (level <= 7) {
        difficulty = "hard";
      } else {
        difficulty = "super";
      }
      applyDifficulty();
    }

    function clickDuck() {
      if (isPaused) return;

      score++;
      document.getElementById("score").textContent = score;

      duck.classList.add("clicked");
