<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chicken Gang - Game Bắn Vịt</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    }
    h1 {
      margin: 20px;
      color: #ff6f61;
      font-family: 'Fredoka One', cursive;
      animation: bounce 2s infinite;
    }
    #scoreboard {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      margin: 10px;
    }
    canvas {
      display: block;
      margin: auto;
      background: #aaffcc; /* xanh neon nhạt */
      border: 2px solid #333;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #ff6f61;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: transform 0.3s, background-color 0.3s;
      margin: 10px;
    }
    button:hover {
      transform: scale(1.1);
      background-color: #e85c50;
    }
  </style>
</head>
<body>
  <h1>🐔 Chicken Gang - Game Bắn Vịt 🦆</h1>
  <div id="scoreboard">Điểm: 0</div>
  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <!-- Các nút điều hướng -->
  <button onclick="saveGame()">💾 Lưu điểm</button>
  <button onclick="window.open('leaderboard.html','_blank')">🏆 Xem Bảng Xếp Hạng</button>
  <button onclick="window.open('index.html','_blank')">⬅️ Quay lại Trang Chủ</button>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let ducks = [];
    let score = 0;
    let explosions = [];

    // Tạo vịt đứng yên, tự biến mất sau 4s
    function createDuck() {
      const x = Math.random() * (canvas.width - 50);
      const y = Math.random() * (canvas.height - 50);
      ducks.push({ x: x, y: y, createdAt: Date.now() });
    }

    function drawDuck(duck) {
      ctx.font = "40px Segoe UI Emoji";
      ctx.fillText("🦆", duck.x, duck.y);
    }

    function drawScore() {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(5, 5, 120, 30);
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("Điểm: " + score, 15, 27);
    }

    // Vẽ hiệu ứng nổ khi vịt bị bắn
    function drawExplosion(explosion) {
      const progress = (Date.now() - explosion.start) / 500; // 0.5s
      if (progress < 1) {
        ctx.beginPath();
        ctx.arc(explosion.x, explosion.y, 20 + progress * 30, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,0,0,${1 - progress})`;
        ctx.fill();
      } else {
        explosions.splice(explosions.indexOf(explosion), 1);
      }
    }

    function update() {
      ctx.fillStyle = "#aaffcc";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ducks.forEach((duck, index) => {
        if (Date.now() - duck.createdAt > 4000) {
          ducks.splice(index, 1);
        } else {
          drawDuck(duck);
        }
      });

      explosions.forEach(explosion => drawExplosion(explosion));

      drawScore();
      requestAnimationFrame(update);
    }

    canvas.addEventListener("mousedown", (e) => {
      if (e.button === 0) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        ducks.forEach((duck, index) => {
          const dx = mouseX - duck.x;
          const dy = mouseY - duck.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 25) {
            // Tạo hiệu ứng nổ
            explosions.push({ x: duck.x, y: duck.y, start: Date.now() });
            ducks.splice(index, 1);
            score++;
            document.getElementById("scoreboard").textContent = "Điểm: " + score;
          }
        });
      }
    });

    setInterval(createDuck, 1500);
    update();

    // Lưu điểm vào localStorage
    function saveGame() {
      let playerName = prompt("Nhập tên của bạn:");
      if (!playerName) playerName = "Người chơi";
      let scores = JSON.parse(localStorage.getItem("scores")) || [];
      scores.push({ name: playerName, score: score });
      localStorage.setItem("scores", JSON.stringify(scores));
      alert("Đã lưu điểm cho " + playerName + " với điểm: " + score);
    }
  </script>
</body>
</html>
